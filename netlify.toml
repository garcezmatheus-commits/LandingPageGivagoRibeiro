[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# O conteúdo do blog vem do WordPress e as capas dos vídeos do YouTube.
[images]
  remote_images = [
    "^https://.*\\.wordpress\\.com/.*",
    "^https://.*\\.files\\.wordpress\\.com/.*",
    "^https://i\\.ytimg\\.com/.*",
    "^https://img\\.youtube\\.com/.*"
  ]

[[headers]]
  for = "/_next/static/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Endereços antigos das páginas legais, para não quebrar links já divulgados.
[[redirects]]
  from = "/politica-de-privacidade"
  to = "/privacidade"
  status = 301

[[redirects]]
  from = "/termos-de-uso"
  to = "/termos"
  status = 301
